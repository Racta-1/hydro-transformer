# experiment name, used as folder name
experiment_name: fedformer_test_v2

# base model type
model: fedformer

# use timestamp positional encoding method
timeF: False

# --- FEDformer configurations --------------------------------------------------------------------------
fedformer_modes: 1
fedformer_version: 'Fourier'
fedformer_base: 'chebyshev'
fedformer_mode_select: 'not'
fedformer_factor: 1

fedformer_nheads: 4
fedformer_e_layers: 4
fedformer_d_layers: 1

# place to store run directory
run_dir: exp/fedformer

# training, validation and test time periods
train_start_date: 1979-10-01
train_end_date: 2007-12-30

validation_start_date: 2008-01-01
validation_end_date: 2015-12-30

test_start_date: 2016-01-01
test_end_date: 2023-02-01

# if you want to use different periods per basin
per_basin_train_periods_file:
per_basin_validation_periods_file:
per_basin_test_periods_file:

# fixed seed
seed: 483593

device: cuda:0

# --- Validation configuration ---------------------------------------------------------------------

validate_every: 1
validate_n_random_basins: 50
cache_validation_data: True

metrics:
- NSE
- NNSE
- MSE
- RMSE
- MAE
- KGE
- Pearson-r

# path to weight file - leave empty for fresh start
checkpoint_path:

# prediction head
head: regression

# ----> Regression settings <----
output_activation: linear

# ----> Embedding network settings <----
statics_embedding:
  type: fc
  # define number of neurons per layer in the FC network used as embedding network
  hiddens:
    - 32
    - 64
  # activation function of embedding network
  activation: tanh
  # dropout applied to embedding network
  dropout: 0.1

# define embedding network for dynamic inputs
dynamics_embedding:
  type: fc
  # define number of neurons per layer in the FC network used as embedding network
  hiddens:
    - 64
    - 128
  # activation function of embedding network
  activation: tanh
  # dropout applied to embedding network
  dropout: 0.1

# ----> General settings <----

# Hidden size should be divisible by transformer_nheads
hidden_size: 256

output_dropout: 0.1

# ----> Transformer settings <----

transformer_nlayers: 2
transformer_positional_encoding_type: sum
transformer_dim_feedforward: 512
transformer_positional_dropout: 0.1
transformer_dropout: 0.1

transformer_nheads: 4

# --- Training configuration -----------------------------------------------------------------------

optimizer: AdamW

# Start with MSE for stability, switch to NSE later if needed
loss: NSE

learning_rate: 1e-4

batch_size: 256

epochs: 50

target_noise_std: 

# Good gradient clipping value
clip_gradient_norm: 1

# Start with single-step prediction
predict_last_n: 1

# REDUCED: From 512 to 256 for stability
seq_length: 1024

log_interval: 20
log_tensorboard: True
log_n_figures: 5
save_weights_every: 1
save_validation_results: True

# --- Data configurations --------------------------------------------------------------------------

dataset: nwm3retro
data_dir: data1
save_train_data: False

dynamic_inputs:
- UGRD_10maboveground_d
- TMP_2maboveground_d
- APCP_surface_d
- VGRD_10maboveground_d
- streamflow_d
- PRES_surface_d
- DSWRF_surface_d
- TMP_2maboveground_u
- APCP_surface_u
- VGRD_10maboveground_u
- PRES_surface_u
- DSWRF_surface_u
- DLWRF_surface_u
- UGRD_10maboveground_u

target_variables:
- streamflow_u

clip_targets_to_zero:
- streamflow_u

static_attributes:
- Contributing_Area_u
- alt_u
- order_u
- n_u
- So_u
- nCC_u
- TopWdth_u
- TopWdthCC_u
- ChSlp_u
- BtmWdth_u
- lon_u
- lat_u
- Shape_Area_u
- Shape_Length_u
- Reach_Length_u
- Contributing_Area_d
- alt_d
- order_d
- n_d
- So_d
- nCC_d
- TopWdth_d
- TopWdthCC_d
- ChSlp_d
- BtmWdth_d
- lon_d
- lat_d
- Shape_Area_d
- Shape_Length_d
- Reach_Length_d


# --- Miscellaneous configuration ------------------------------------------------------------------
early_stopping: True   
patience_early_stopping: 10 
minimum_epochs_before_early_stopping: 10 
dynamic_learning_rate: True 
patience_dynamic_learning_rate: 3 
factor_dynamic_learning_rate: 0.5